<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    gameplay-promo. A film cell with sprocket holes and a play triangle: video, made from something
    that runs.

    Deliberately not a rocket, a controller or a pixel sprite. The skill films any game — a
    game-specific mark would describe one project rather than the tool, and this one already had a
    rocket in it once for exactly that wrong reason.

    Two flat colours on a near-black ground, so it holds on both GitHub themes, and nothing thinner
    than 14px at this size, so it survives being shown at 64.
  -->
  <rect width="512" height="512" rx="104" fill="#12151F"/>

  <!-- The cell. Inset far enough that the rounded corners of the plate stay visible behind it. -->
  <rect x="96" y="112" width="320" height="288" rx="28" fill="none" stroke="#5FA8FF" stroke-width="20"/>

  <!-- Sprockets, four a side. Their rhythm is what makes it read as film rather than a picture frame. -->
  <g fill="#5FA8FF">
    <rect x="128" y="152" width="26" height="30" rx="8"/>
    <rect x="128" y="212" width="26" height="30" rx="8"/>
    <rect x="128" y="272" width="26" height="30" rx="8"/>
    <rect x="128" y="332" width="26" height="30" rx="8"/>

    <rect x="358" y="152" width="26" height="30" rx="8"/>
    <rect x="358" y="212" width="26" height="30" rx="8"/>
    <rect x="358" y="272" width="26" height="30" rx="8"/>
    <rect x="358" y="332" width="26" height="30" rx="8"/>
  </g>

  <!-- Play. Gold against the blue so the eye lands here first; rounded so it sits with the cell. -->
  <path d="M228 196 L324 256 L228 316 Z" fill="#F2C230" stroke="#F2C230" stroke-width="26"
        stroke-linejoin="round"/>
</svg>
